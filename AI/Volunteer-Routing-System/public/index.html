<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volunteer + Hospital Digital Twin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Volunteer <span>Dispatch</span><small>Hospital digital twin</small></div>
  <div class="seg" id="strategy" role="group" aria-label="Dispatch rule">
    <button data-s="nearest">Nearest hospital</button>
    <button data-s="aware" class="on">Load-aware</button>
  </div>
  <div class="spacer"></div>
  <div class="conn" id="conn"><i></i><span>Connecting</span></div>
  <button class="btn" id="fromReports" title="Create casualties from the Disaster Detection reports">From detection reports</button>
  <button class="btn" id="wave">Add casualty wave</button>
  <button class="btn" id="block">Close a road</button>
  <button class="btn" id="reset">Reset</button>
</header>

<div class="app">
  <section class="col left">
    <h3>Hospitals</h3>
    <div id="hospitals"></div>
    <h3>Volunteers <em id="volSummary"></em></h3>
    <div id="vols"></div>
  </section>

  <div id="map"></div>

  <section class="col right">
    <h3>Outcome so far</h3>
    <div id="metrics"></div>
    <h3>Closed roads</h3>
    <div id="roads"></div>
    <h3>Decisions</h3>
    <div id="events"></div>
    <h3>Measured on simulated scenarios</h3>
    <div id="evalbox"></div>
  </section>
</div>
<div class="hint" id="hint" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
